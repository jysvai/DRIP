# 매일 아침 전날 고속도로 교통(도로공사 AVC 15분 자료)을 받아 게임의 '실제 교통'을 새로 만들고 사이트를 다시 올린다.
# 저장소 비밀 EX_API_KEY가 있어야 돈다 (없으면 건너뛴다). R2_* 비밀 네 개가 있으면 원자료도 R2(raw/ex/avc15/)에 쌓는다.
name: Collect traffic

on:
  schedule:
    - cron: "40 21 * * *" # 매일 06:40 (한국 시간)
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 YYYYMMDD (비우면 어제)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      EX_API_KEY: ${{ secrets.EX_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DATE: ${{ inputs.date }}
    steps:
      - name: Check key
        id: key
        run: |
          if [ -z "$EX_API_KEY" ]; then
            echo "::notice::저장소 비밀 EX_API_KEY가 없어 건너뜁니다 (README의 '실제 교통 수집' 참고)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v7
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.13"
      - name: Collect
        if: steps.key.outputs.ok == 'true'
        run: |
          pip install --quiet numpy pyproj python-dotenv boto3
          args=()
          if [ -n "$DATE" ]; then
            [[ "$DATE" =~ ^[0-9]{8}$ ]] || { echo "::error::날짜는 YYYYMMDD"; exit 1; }
            args+=(--date "$DATE")
          fi
          if [ -n "$R2_BUCKET" ]; then args+=(--upload); fi
          python pipeline/traffic_ex.py daily "${args[@]}"
      - name: Commit and redeploy
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/public/traffic/latest.json data/processed/traffic
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다"
            exit 0
          fi
          git commit -m "Update real traffic for $(jq -r .date game/public/traffic/latest.json)"
          git push
          # GITHUB_TOKEN으로 올린 커밋은 다른 워크플로를 깨우지 않아서 배포를 직접 부른다
          gh workflow run pages.yml --ref main
