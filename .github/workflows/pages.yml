# 소개 페이지(web/)와 주행 게임(game/ → /play/)을 GitHub Pages(https://jysvai.github.io/DRIP/)에 올린다.
# 게임 빌드에는 저장소 변수 VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY를 쓴다 (브라우저에 넣어도 되는 공개 키).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "game/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Test and build game
        working-directory: game
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r game/dist _site/play
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
